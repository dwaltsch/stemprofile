<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fav-ridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="fav-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Base Badge Frame -->
  <rect width="64" height="64" rx="15" fill="url(#fav-bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Elevation Mountain Profile Body -->
  <path d="M 8 50 L 8 46 Q 16 46 22 36 T 34 32 T 46 18 L 56 34 L 56 50 Z" fill="url(#fav-fill)"/>

  <!-- Color Blocked Segment Columns -->
  <!-- Block 1: Flat/Green -->
  <polygon points="8,50 8,46 20,38 20,50" fill="#10b981" opacity="0.9"/>
  <!-- Block 2: Moderate/Amber -->
  <polygon points="20,50 20,38 34,32 34,50" fill="#f59e0b" opacity="0.9"/>
  <!-- Block 3: Steep/Orange -->
  <polygon points="34,50 34,32 46,18 46,50" fill="#f97316" opacity="0.95"/>
  <!-- Block 4: Descent/Red -->
  <polygon points="46,50 46,18 56,34 56,50" fill="#ef4444" opacity="0.95"/>

  <!-- Segment Dividers -->
  <line x1="20" y1="38" x2="20" y2="50" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="34" y1="32" x2="34" y2="50" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="46" y1="18" x2="46" y2="50" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Profile Skyline Ridge -->
  <path d="M 8 46 Q 16 46 20 38 L 34 32 L 46 18 L 56 34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Summit Peak Callout Indicator -->
  <line x1="46" y1="18" x2="46" y2="10" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,1.5"/>
  <circle cx="46" cy="18" r="3.2" fill="#ef4444" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="46" cy="9" r="2.2" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
</svg>
