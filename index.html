<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StemProfile — Elevation Sticker Studio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
      <span>StemProfile</span>
    </div>

    <div class="actions">
      <button class="btn" id="btn-copy-svg" disabled>Copy SVG</button>
      <button class="btn" id="btn-export-svg" disabled>SVG</button>
      <button class="btn" id="btn-export-png" disabled>PNG (300 DPI)</button>
      <button class="btn btn-primary" id="btn-print" disabled>Print</button>
    </div>
  </header>

  <!-- Studio Layout -->
  <div class="app-layout">
    
    <!-- Sidebar Controls -->
    <aside>
      
      <!-- 1. Upload GPX -->
      <div>
        <div class="section-title">Track File</div>
        <div class="dropzone" id="dropzone">
          <input type="file" id="file-input" accept=".gpx" />
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <p id="dropzone-filename">Drop GPX track here</p>
          <span>or click to browse</span>
        </div>
      </div>

      <!-- 2. Physical Dimensions -->
      <div>
        <div class="section-title">Sticker Size</div>
        <div class="control-group">
          <div class="field">
            <select id="preset-size">
              <option value="110x35" selected>Top Tube (110 × 35 mm)</option>
              <option value="100x28">Slim Stem (100 × 28 mm)</option>
              <option value="75x30">Compact Stem (75 × 30 mm)</option>
              <option value="130x35">Long Top Tube (130 × 35 mm)</option>
              <option value="custom">Custom...</option>
            </select>
          </div>

          <div class="field-grid">
            <div class="field">
              <label class="field-label" for="input-w-mm">Width (mm)</label>
              <input type="number" id="input-w-mm" value="110" min="20" max="400">
            </div>
            <div class="field">
              <label class="field-label" for="input-h-mm">Height (mm)</label>
              <input type="number" id="input-h-mm" value="35" min="10" max="200">
            </div>
          </div>

          <div class="field-grid">
            <div class="field">
              <label class="field-label" for="input-radius">Corners</label>
              <select id="input-radius">
                <option value="0">Square (0mm)</option>
                <option value="2" selected>Rounded (2mm)</option>
                <option value="4">Pill (4mm)</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="input-copies">Copies</label>
              <select id="input-copies">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="4">4</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. Segmentation & Styling -->
      <div>
        <div class="section-title">Segmentation & Style</div>
        <div class="control-group">
          
          <div class="field">
            <label class="field-label" for="select-block-size">Segment Block Size</label>
            <select id="select-block-size">
              <option value="1000" selected>1.0 km (Grand Tour Roadbook)</option>
              <option value="500">500m (Standard Blocks)</option>
              <option value="250">250m (Fine Blocks)</option>
              <option value="100">100m (Granular Blocks)</option>
              <option value="0">Smooth (Continuous Curve)</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="select-theme">Theme</label>
            <select id="select-theme">
              <option value="dark" selected>Dark Cockpit</option>
              <option value="white">Print White</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="select-units">Units</label>
            <select id="select-units">
              <option value="metric" selected>Metric (km / m)</option>
              <option value="imperial">Imperial (mi / ft)</option>
            </select>
          </div>

          <div class="field">
            <div class="field-label">
              <span>Smoothing</span>
              <span id="label-smoothing" style="color:var(--accent);">7 pt</span>
            </div>
            <input type="range" id="slider-smoothing" min="1" max="21" step="2" value="7">
          </div>

          <div class="field">
            <label class="field-label" for="input-title">Header Title</label>
            <input type="text" id="input-title" placeholder="Route Name">
          </div>

          <div style="display:flex; flex-direction:column; gap:0.45rem; margin-top:0.3rem;">
            <label class="checkbox-row">
              <input type="checkbox" id="chk-block-pct" checked>
              <span>Show gradient % in blocks</span>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="chk-climbs" checked>
              <span>Climb summit badges</span>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="chk-header" checked>
              <span>Title & stats header</span>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="chk-distance" checked>
              <span>Distance ticks</span>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="chk-ele-labels" checked>
              <span>Min / max elevation</span>
            </label>
            <label class="checkbox-row">
              <input type="checkbox" id="chk-cut" checked>
              <span>Outer cut guides</span>
            </label>
          </div>
        </div>
      </div>

    </aside>

    <!-- Center Stage -->
    <main class="stage-area">
      
      <!-- Vector Profile Stage -->
      <div class="preview-stage">
        <div class="stage-badge" id="stage-size-label">110 × 35 mm</div>
        
        <div class="sticker-wrapper" id="sticker-container">
          <div id="svg-host"></div>
          <div id="cursor-tip"></div>
        </div>
      </div>

      <!-- Quick Metrics -->
      <div class="stats-strip">
        <div class="stat-item">
          <span class="stat-label">Distance</span>
          <span class="stat-value" id="stat-dist">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Elevation Gain</span>
          <span class="stat-value" id="stat-gain" style="color:var(--z1);">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Max Gradient</span>
          <span class="stat-value" id="stat-max-grade" style="color:var(--z4);">--</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Climbs</span>
          <span class="stat-value" id="stat-climbs">--</span>
        </div>
      </div>

      <!-- Detected Climbs -->
      <div class="climbs-box" id="climbs-box" style="display:none;">
        <h4>Detected Climbs</h4>
        <table class="climbs-table">
          <thead>
            <tr>
              <th>Cat</th>
              <th>Location</th>
              <th>Length</th>
              <th>Avg %</th>
              <th>Gain</th>
              <th>Summit</th>
            </tr>
          </thead>
          <tbody id="climbs-table-body"></tbody>
        </table>
      </div>

    </main>

  </div>

  <!-- Print Sheet Matrix -->
  <div id="print-output-sheet">
    <div class="print-matrix" id="print-matrix"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
